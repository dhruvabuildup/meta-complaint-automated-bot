name: CI

on:
  push:
    branches: ["main", "feat/*"]
  pull_request:
    branches: ["main"]

jobs:
  quality:
    name: Lint, Typecheck, and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: meta_bot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run Ruff Formatter Check
        run: ruff format --check .

      - name: Run Mypy Typecheck
        run: mypy --strict

      - name: Run Pytest
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@localhost:5432/meta_bot_test
          REDIS_URL: redis://localhost:6379/0
          APP_ID: "123456789012345"
          APP_SECRET: "mock_app_secret_value_for_testing_purposes"
          VERIFY_TOKEN: "mock_verify_token_value_for_testing"
          PAGE_ID: "100000000000001"
          IG_ACCOUNT_ID: "17841400000000001"
          PAGE_ACCESS_TOKEN: "mock_page_access_token_value_testing"
          TOKEN_ENC_KEY: "MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE="
          ADMIN_TOKEN: "mock_admin_token_value_for_testing_0"
        run: pytest -v
